<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend+Deca:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="container">
      <picture class="header-image">
        <source
          media="(min-width: 768px)"
          srcset="./images/image-header-desktop.jpg"
        />
        <img src="./images/image-header-mobile.jpg" alt="Header" />
      </picture>
      <section class="content">
        <h2>Get <span>Insights</span> that help your business grow.</h2>
        <p class="detail">
          Discover the benefits of data analytics and make better decisions
          regarding revenue, customer experience, and overall efficiency.
        </p>
        <ul class="stats-wrap">
          <li class="stats">
            <p>10K+</p>
            <span>COMPANIES</span>
          </li>
          <li class="stats">
            <p>314</p>
            <span>TEMPLATES</span>
          </li>
          <li class="stats">
            <p>12M+</p>
            <span>QUERIES</span>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
